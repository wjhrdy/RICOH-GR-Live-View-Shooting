name: Firmware Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create or update, for example v4.0.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: firmware-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    name: test, build and publish auto-selfie firmware
    runs-on: ubuntu-latest

    env:
      PIO_ENV: m5stack-sticks3
      REQUESTED_TAG: ${{ github.event.inputs.tag_name || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release source
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG_NAME="auto-selfie-${GITHUB_SHA:0:12}"
          else
            TAG_NAME="${REQUESTED_TAG}"
            if [[ ! "${TAG_NAME}" =~ ^v[0-9]+([.][0-9]+)*([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Release tags must look like v4.0.1 or v4.0.1-beta.1."
              exit 1
            fi
          fi

          if git rev-parse --verify --quiet "refs/tags/${TAG_NAME}" >/dev/null; then
            git checkout --detach "refs/tags/${TAG_NAME}"
          fi
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install PlatformIO
        run: pip install -r .github/requirements.txt

      - name: Test before publishing
        run: |
          python scripts/check_model_includes.py
          platformio test -e native -e native-gr2 -e native-gr3 -e native-gr4
          PLATFORMIO_BUILD_FLAGS=-DUI_AUTO_SELFIE=1 platformio test -e native --filter test_native_ui

      - name: Build and verify auto-selfie installation package
        run: platformio run -e "${PIO_ENV}" -t package

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > dist/release-notes.md <<EOF
          Auto-selfie firmware for **M5Stack StickS3**. Boots into automatic top-down/selfie mode.

          **Download ricoh-auto-selfie-merged.bin below**, then open [Espressif's browser flasher](https://espressif.github.io/esptool-js/) in Chrome or Edge. Connect the StickS3, select the file, set address **0x0**, mode **DIO**, frequency **80 MHz**, size **8 MB**, and program it.

          Installing the combined image replaces settings and camera pairing. Pair again after restarting. For an existing matching partition layout, firmware.bin at 0x10000 preserves settings; leave Erase all unchecked.

          [Full installation instructions](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_COMMIT}/docs/install-auto-selfie.md)

          - Auto-selfie: **enabled and checked during packaging**
          - Environment: ${PIO_ENV}
          - Source: ${RELEASE_COMMIT}
          - Build metadata: build-info.json; checksums: SHA256SUMS
          - Merged image includes bootloader, partition table, boot_app0, and app.
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "Auto-selfie ${RELEASE_TAG}" \
              --notes-file dist/release-notes.md --latest
          else
            gh release create "${RELEASE_TAG}" --target "${RELEASE_COMMIT}" \
              --title "Auto-selfie ${RELEASE_TAG}" \
              --notes-file dist/release-notes.md --latest
          fi
          gh release upload "${RELEASE_TAG}" dist/"${PIO_ENV}"/* --clobber
